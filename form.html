<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <header>
            Aplikasi Manajemen Pegawi
        </header>

        <div class="container">
            <aside>
            <ul class="menu">
                <li><a href="dashboard.html" class="aktif">Dashboard</a></li>
                <li><a href="tabel.html" class="aktif">Data Pegawai</a></li>
                <li><a href="tabel.html" class="aktif">Data Jabatan</a></li>
                <li><a href="login.html" class="aktif">Keluar</a></li>
            </ul>
        </aside>

        <section class="main">
            <div class="form-card">
                <h2 class="judul">Tambah Pegawai</h2>
                <form method="post" action="proses.php">
                    <div class="form-group">
                        <lable for="foto">Foto</lable>
                        <div class="input"><input type="file" name="nama" id="foto"></div>
                    </div>

                    <div class="form-group">
                        <lable for="nama">Nama</lable>
                        <div class="input">
                            <input type="text" name="nama" id="nama">
                        </div>
                    </div>

                    <div class="form-group">
                        <lable for="jk">Jenis Kelamin</lable>
                        <div class="input-radio-group">
                            <lable class="radio-lable">
                                <input type="radio" name="jk" value="L">Laki-laki
                            </lable>
                            <lable class="radio-lable">
                                <input type="radio" name="jk" value="P">Perempuan
                            </lable>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <lable for="tanggal">Tanggal</lable>
                        <div class="input"><input type="date" name="tanggal" id="tanggal"></div>
                    </div>

                    <div class="form-group">
                        <lable for="jabatan">Jabatan</lable>
                        <div class="input">
                        <select id="jabatam" name="jabatan">
                            <option value="direktur">Direktur</option>
                            <option value="manajer">Manajer</option>
                            <option value="marketing">Marketing</option>
                            <option value="sekretaris">Sekretaris</option>
                        </select>
                        </div>
                    </div>

                    <div class="form-group tombol-group"></div>
                        <div class="input">
                            <input type="submit" name="Simpan" class="tombol simpan">
                            <input type="reset" name="Batal" class="tombol reset">
                        </div>
                    </div>
                </form>
            </div>
        </section>
</body>
</html>
